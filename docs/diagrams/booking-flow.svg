<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">DineReserve booking, no-show and waitlist flow</title>
  <desc id="flowDesc">Activity diagram from availability search REQ-1.1 through booking REQ-1.2, confirmation e-mail and reminders REQ-1.4, check-in REQ-1.6, and the no-show or cancellation branch that releases the table and promotes the waitlist REQ-1.5.</desc>

  <defs>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="flowArrowPlanned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#f8fafc"/>
  <text x="620" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Booking flow: reservation, no-show and waitlist</text>
  <text x="620" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Solid = W6 scope · Green = confirmed · Dashed = planned W7–W11</text>

  <!-- start -->
  <rect x="100" y="24" width="360" height="48" rx="24" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="280" y="53" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#065f46" text-anchor="middle">Diner opens booking page</text>
  <line x1="280" y1="72" x2="280" y2="102" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- search -->
  <rect x="100" y="102" width="360" height="58" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="280" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Search availability (REQ-1.1)</text>
  <text x="280" y="146" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">date · time · party size</text>
  <line x1="280" y1="160" x2="280" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- results -->
  <rect x="100" y="190" width="360" height="58" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="280" y="214" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Results: free slots + table list</text>
  <text x="280" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">AvailabilityService</text>
  <line x1="280" y1="248" x2="280" y2="265" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- decision: table + slot chosen -->
  <polygon points="280,265 410,320 280,375 150,320" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="280" y="314" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle">Table + slot</text>
  <text x="280" y="334" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle">chosen?</text>
  <line x1="280" y1="375" x2="280" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="296" y="396" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#047857">Yes</text>
  <path d="M 150 320 L 40 320 L 40 219 L 100 219" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="52" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">No · change filters</text>

  <!-- guest form -->
  <rect x="100" y="410" width="360" height="58" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="280" y="434" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Fill guest details</text>
  <text x="280" y="454" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">name · e-mail · mobile</text>
  <line x1="280" y1="468" x2="280" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- submit -->
  <rect x="100" y="500" width="360" height="58" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="280" y="524" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Submit booking</text>
  <text x="280" y="544" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">POST /api/v1/bookings · idempotency token</text>
  <line x1="280" y1="558" x2="280" y2="565" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- decision: table taken -->
  <polygon points="280,565 410,620 280,675 150,620" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="280" y="614" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#92400e" text-anchor="middle">TABLE_TAKEN</text>
  <text x="280" y="634" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">(409)?</text>
  <path d="M 410 620 L 470 620 L 470 476 L 600 476" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="430" y="606" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b45309">Yes</text>

  <!-- conflict branch -->
  <rect x="600" y="450" width="280" height="52" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="740" y="474" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">409 TABLE_TAKEN</text>
  <text x="740" y="492" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">show up to 3 alternatives</text>
  <path d="M 740 450 L 740 218 L 460 218" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="560" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">retry with alternatives</text>

  <!-- no conflict -> confirmed -->
  <line x1="280" y1="675" x2="280" y2="724" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="294" y="700" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#047857">No</text>
  <rect x="100" y="724" width="360" height="58" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="280" y="748" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">Booking CONFIRMED</text>
  <text x="280" y="768" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#065f46" text-anchor="middle">reference issued (REQ-1.2)</text>

  <!-- confirmed -> notification lane -->
  <path d="M 280 782 L 280 810 L 1180 810 L 1180 128 L 1160 128" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="600" y="800" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle">booking confirmed → notification (REQ-1.4)</text>

  <!-- cancellation branch -->
  <rect x="620" y="100" width="260" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="750" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">Cancel / change (REQ-1.3)</text>
  <text x="750" y="144" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">W7 · before cut-off</text>
  <line x1="920" y1="128" x2="880" y2="128" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#flowArrowPlanned)"/>
  <path d="M 880 128 L 900 128 L 900 668 L 880 668" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#flowArrowPlanned)"/>

  <!-- confirmation and reminders (planned, REQ-1.4) -->
  <rect x="920" y="100" width="240" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1040" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">Confirmation e-mail</text>
  <text x="1040" y="144" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">(REQ-1.4 · W8)</text>
  <line x1="1040" y1="156" x2="1040" y2="190" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#flowArrowPlanned)"/>

  <rect x="920" y="190" width="240" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1040" y="214" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">24 h + 2 h reminders</text>
  <text x="1040" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">(REQ-1.4 · W8)</text>
  <line x1="1040" y1="246" x2="1040" y2="260" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#flowArrowPlanned)"/>

  <!-- decision: guest arrives -->
  <polygon points="1040,260 1150,310 1040,360 930,310" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1040" y="305" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle">Guest arrives</text>
  <text x="1040" y="325" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle">on time?</text>
  <line x1="1040" y1="360" x2="1040" y2="405" stroke="#047857" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="1054" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#047857">Yes</text>

  <!-- check-in and service complete (planned, REQ-1.6) -->
  <rect x="920" y="405" width="240" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1040" y="429" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">Host check-in → SEATED</text>
  <text x="1040" y="449" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">(REQ-1.6 · W10)</text>
  <line x1="1040" y1="461" x2="1040" y2="500" stroke="#047857" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <rect x="920" y="500" width="240" height="48" rx="24" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="1040" y="521" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#065f46" text-anchor="middle">Service complete</text>
  <text x="1040" y="539" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#065f46" text-anchor="middle">table released</text>

  <!-- no-show / late cancel branch -->
  <path d="M 930 310 L 885 310 L 885 568 L 880 568" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#flowArrowPlanned)"/>
  <text x="895" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b45309">No</text>

  <rect x="620" y="540" width="260" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="750" y="564" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">No-show / late cancel</text>
  <text x="750" y="584" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">(REQ-1.3 · REQ-1.6)</text>
  <line x1="750" y1="596" x2="750" y2="640" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#flowArrowPlanned)"/>

  <rect x="620" y="640" width="260" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="750" y="664" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">Release table</text>
  <text x="750" y="684" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">booking_events: released</text>
  <line x1="750" y1="696" x2="750" y2="730" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#flowArrowPlanned)"/>

  <rect x="620" y="730" width="260" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="750" y="753" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">Promote waitlist (REQ-1.5)</text>
  <text x="750" y="773" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">first entry · 5-min offer · booking</text>

  <!-- legend -->
  <text x="60" y="870" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Rounded = start/end · rectangle = step · diamond = decision · solid = W6 scope · dashed = planned W7–W11</text>
  <text x="60" y="893" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">W6 implements search (REQ-1.1) and booking (REQ-1.2); notification, check-in and waitlist branches are planned (URS §9–§11).</text>
</svg>
